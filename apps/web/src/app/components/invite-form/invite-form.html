<form
  class="flex w-full flex-col items-center justify-center gap-10 px-8 py-10 max-[560px]:px-4 max-[560px]:py-6"
  [formGroup]="form"
  (submit)="requestSubmit()"
>
  <div class="relative flex w-full flex-col justify-center gap-1.5">
    <label for="email" class="font-bold text-gray-800">Nome/Email:</label>

    <input
      type="text"
      id="email"
      placeholder="Buscar usuário por nome ou email..."
      class="min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-900 outline-none focus:border-green-500 focus:shadow-[0_0_0_3px_rgba(34,197,94,0.16)]"
      autocomplete="off"
      formControlName="search"
      (input)="onChangeSearch($event)"
    />

    @if (this.hasSearch()) {
      <div
        class="absolute left-0 top-[calc(100%+8px)] z-20 grid w-full overflow-hidden rounded-lg border border-gray-200 bg-white shadow-[0_16px_40px_rgba(15,23,42,0.16)]"
        role="listbox"
        aria-label="Usuários encontrados"
      >
        @for (user of users(); track user.id) {
          <button
            type="button"
            class="flex cursor-pointer items-center gap-3 border-0 border-b border-gray-100 bg-white p-3 text-left text-gray-900 last:border-b-0 hover:bg-green-50 focus:bg-green-50 focus:outline-none"
            role="option"
            (click)="onSelectUser(user)"
            [value]="user.id"
          >
            <span
              class="inline-flex h-10 w-10 flex-none items-center justify-center rounded-full bg-green-100 text-sm font-extrabold text-green-800"
            >
              {{ getInitials(user.name) }}
            </span>
            <span class="grid min-w-0 gap-0.5">
              <strong class="overflow-hidden text-ellipsis whitespace-nowrap">{{
                user.name
              }}</strong>
              <small class="overflow-hidden text-ellipsis whitespace-nowrap text-gray-500">{{
                user.email
              }}</small>
            </span>
          </button>
        }
      </div>
    }
  </div>

  <div class="flex w-full flex-col justify-center gap-1.5 overflow-hidden">
    <label for="role" class="font-bold text-gray-800">Cargo:</label>
    <select id="role" formControlName="role">
      <option value="MANAGER">
        {{ 'MANAGER' | membershipRole }}
      </option>

      <option value="MEMBER">
        {{ 'MEMBER' | membershipRole }}
      </option>
    </select>
  </div>

  <footer
    class="flex items-center gap-10 max-[560px]:w-full max-[560px]:flex-col-reverse max-[560px]:gap-3"
  >
    <button
      type="button"
      class="min-h-13 cursor-pointer rounded border border-gray-300 bg-white px-6 py-4 text-lg font-bold leading-none text-gray-900 hover:brightness-[0.97] max-[560px]:w-full"
      (click)="cancel.emit()"
    >
      Cancelar
    </button>
    <button
      [disabled]="!selectedUser() || form.invalid"
      type="submit"
      class="min-h-13 cursor-pointer rounded border border-green-400 bg-green-400 px-6 py-4 text-lg font-bold leading-none text-white hover:brightness-[0.97] max-[560px]:w-full"
    >
      Enviar convite
    </button>
  </footer>
  <p>{{ error() }}</p>
</form>
